name: build-caddy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CADDY_VERSION: 2.11.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: git.milkshake.services
          username: ${{ forgejo.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: CADDY_VERSION=${{ env.CADDY_VERSION }}
          tags: |
            git.milkshake.services/floatingmilkshake/caddy-porkbun:latest
            git.milkshake.services/floatingmilkshake/caddy-porkbun:${{ env.CADDY_VERSION }}
