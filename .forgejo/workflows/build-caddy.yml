name: build-caddy

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    uses: FloatingMilkshake/actions/.forgejo/workflows/docker/docker-build-push.yml@main
    with:
      image-name: floatingmilkshake/caddy-porkbun
      push: ${{ forgejo.event_name == 'workflow_dispatch' || (forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main') }}
      extra-tag: 2.11.4
    secrets:
      registry-token: ${{ secrets.REGISTRY_TOKEN }}
